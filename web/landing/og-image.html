<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #0F1020 0%, #1A1B3A 40%, #0F1020 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
}
.glow-1 { width: 300px; height: 300px; background: #3B82F6; top: -80px; left: -60px; }
.glow-2 { width: 250px; height: 250px; background: #10B981; bottom: -60px; right: -40px; }
.glow-3 { width: 200px; height: 200px; background: #EC4899; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.15; }
.content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 0 80px;
}
.logo-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 40px;
}
.logo-text {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 6px;
  color: #FFFFFF;
}
.tagline {
  font-size: 52px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.2;
  margin-bottom: 24px;
  letter-spacing: -1px;
}
.tagline .accent {
  background: linear-gradient(135deg, #3B82F6, #10B981, #EC4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  font-size: 22px;
  color: rgba(255,255,255,0.6);
  font-weight: 400;
  letter-spacing: 0.3px;
}
.pills {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 36px;
}
.pill {
  padding: 10px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  color: #FFFFFF;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08);
  letter-spacing: 0.3px;
}
.pill-icon {
  margin-right: 6px;
}
.border-frame {
  position: absolute;
  top: 20px; left: 20px; right: 20px; bottom: 20px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 24px;
  pointer-events: none;
}
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <div class="border-frame"></div>
  <div class="content">
    <div class="logo-mark">
      <svg width="48" height="48" viewBox="105 110 190 175">
        <defs>
          <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#10B981" stop-opacity=".9"/>
          </linearGradient>
        </defs>
        <circle cx="200" cy="165" r="6" fill="#EF4444"/>
        <line x1="200" y1="260" x2="140" y2="200" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="140" y1="200" x2="130" y2="160" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="130" y1="160" x2="155" y2="135" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="155" y1="135" x2="185" y2="140" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="185" y1="140" x2="200" y2="165" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="200" y1="165" x2="215" y2="140" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="215" y1="140" x2="245" y2="135" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="245" y1="135" x2="270" y2="160" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="270" y1="160" x2="260" y2="200" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <line x1="260" y1="200" x2="200" y2="260" stroke="url(#ng)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="200" cy="260" r="8" fill="white"/>
        <circle cx="140" cy="200" r="6" fill="#3B82F6"/>
        <circle cx="130" cy="160" r="5" fill="#10B981"/>
        <circle cx="155" cy="135" r="6" fill="#F59E0B"/>
        <circle cx="185" cy="140" r="5" fill="#8B5CF6"/>
        <circle cx="200" cy="165" r="9" fill="#EF4444"/>
        <circle cx="215" cy="140" r="5" fill="#8B5CF6"/>
        <circle cx="245" cy="135" r="6" fill="#F59E0B"/>
        <circle cx="270" cy="160" r="5" fill="#10B981"/>
        <circle cx="260" cy="200" r="6" fill="#3B82F6"/>
      </svg>
      <span class="logo-text">SIVENA</span>
    </div>
    <div class="tagline">Manage your <span class="accent">life, together</span></div>
    <div class="subtitle">Tasks, meals, finances, habits, wellness &mdash; one shared space for the people who matter most</div>
    <div class="pills">
      <span class="pill">&#128197; Calendar</span>
      <span class="pill">&#127860; Meals</span>
      <span class="pill">&#128176; Budget</span>
      <span class="pill">&#9989; Tasks</span>
      <span class="pill">&#128154; Wellness</span>
    </div>
  </div>
</body>
</html>
