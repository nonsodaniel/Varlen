<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1020"/>
      <stop offset="50%" stop-color="#1A1B3A"/>
      <stop offset="100%" stop-color="#0F1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow effects -->
  <circle cx="100" cy="80" r="180" fill="#3B82F6" opacity="0.12" filter="url(#glow1)"/>
  <circle cx="1100" cy="550" r="160" fill="#10B981" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="600" cy="300" r="120" fill="#EC4899" opacity="0.06" filter="url(#glow1)"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" ry="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Logo icon (scaled Sivena heart/network) -->
  <g transform="translate(540, 100) scale(0.55)">
    <line x1="200" y1="260" x2="140" y2="200" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="200" x2="130" y2="160" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="160" x2="155" y2="135" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="155" y1="135" x2="185" y2="140" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="185" y1="140" x2="200" y2="165" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="165" x2="215" y2="140" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="215" y1="140" x2="245" y2="135" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="245" y1="135" x2="270" y2="160" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="270" y1="160" x2="260" y2="200" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <line x1="260" y1="200" x2="200" y2="260" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="260" r="9" fill="white"/>
    <circle cx="140" cy="200" r="7" fill="#3B82F6"/>
    <circle cx="130" cy="160" r="6" fill="#10B981"/>
    <circle cx="155" cy="135" r="7" fill="#F59E0B"/>
    <circle cx="185" cy="140" r="6" fill="#8B5CF6"/>
    <circle cx="200" cy="165" r="11" fill="#EF4444"/>
    <circle cx="215" cy="140" r="6" fill="#8B5CF6"/>
    <circle cx="245" cy="135" r="7" fill="#F59E0B"/>
    <circle cx="270" cy="160" r="6" fill="#10B981"/>
    <circle cx="260" cy="200" r="7" fill="#3B82F6"/>
  </g>

  <!-- SIVENA text -->
  <text x="600" y="285" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" letter-spacing="6" fill="white">SIVENA</text>

  <!-- Main tagline -->
  <text x="600" y="360" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="-1">Manage your life, together</text>

  <!-- Gradient underline for accent -->
  <rect x="310" y="372" width="580" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="rgba(255,255,255,0.55)" font-weight="400">Tasks, meals, finances, habits, wellness in one shared space</text>

  <!-- Feature pills -->
  <g transform="translate(600, 490)">
    <!-- Calendar -->
    <rect x="-290" y="-18" width="100" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="-240" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Calendar</text>

    <!-- Meals -->
    <rect x="-175" y="-18" width="80" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="-135" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Meals</text>

    <!-- Budget -->
    <rect x="-80" y="-18" width="85" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="-38" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Budget</text>

    <!-- Tasks -->
    <rect x="20" y="-18" width="75" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="58" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Tasks</text>

    <!-- Wellness -->
    <rect x="110" y="-18" width="95" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="157" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Wellness</text>

    <!-- Habits -->
    <rect x="220" y="-18" width="80" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="260" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Habits</text>
  </g>

  <!-- URL at bottom -->
  <text x="600" y="575" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="rgba(255,255,255,0.35)" font-weight="500" letter-spacing="1">sivena.app</text>
</svg>
