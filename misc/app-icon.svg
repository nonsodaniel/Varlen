<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="iconLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="iconRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0" />
    </radialGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconStarGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" fill="url(#iconBg)"/>

  <!-- Subtle pulse rings (static for icon) -->
  <circle cx="512" cy="422" r="80" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.1"/>
  <circle cx="512" cy="422" r="130" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.06"/>

  <!-- Red glow behind center star -->
  <circle cx="512" cy="422" r="45" fill="url(#iconRedGlow)"/>

  <!-- Constellation lines -->
  <line x1="512" y1="665" x2="358" y2="512" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="358" y1="512" x2="332" y2="410" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="332" y1="410" x2="396" y2="346" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="396" y1="346" x2="474" y2="358" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="474" y1="358" x2="512" y2="422" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="512" y1="422" x2="550" y2="358" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="550" y1="358" x2="628" y2="346" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="628" y1="346" x2="692" y2="410" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="692" y1="410" x2="666" y2="512" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>
  <line x1="666" y1="512" x2="512" y2="665" stroke="url(#iconLine)" stroke-width="5" stroke-linecap="round"/>

  <!-- Star nodes -->
  <circle cx="512" cy="665" r="16" fill="white" filter="url(#iconStarGlow)"/>
  <circle cx="358" cy="512" r="13" fill="#3B82F6" filter="url(#iconStarGlow)"/>
  <circle cx="332" cy="410" r="10" fill="#10B981" filter="url(#iconStarGlow)"/>
  <circle cx="396" cy="346" r="13" fill="#F59E0B" filter="url(#iconStarGlow)"/>
  <circle cx="474" cy="358" r="10" fill="#8B5CF6" filter="url(#iconStarGlow)"/>

  <!-- Center star - RED -->
  <circle cx="512" cy="422" r="22" fill="#FCA5A5" filter="url(#iconGlow)" opacity="0.4"/>
  <circle cx="512" cy="422" r="18" fill="#EF4444"/>

  <circle cx="550" cy="358" r="10" fill="#8B5CF6" filter="url(#iconStarGlow)"/>
  <circle cx="628" cy="346" r="13" fill="#F59E0B" filter="url(#iconStarGlow)"/>
  <circle cx="692" cy="410" r="10" fill="#10B981" filter="url(#iconStarGlow)"/>
  <circle cx="666" cy="512" r="13" fill="#3B82F6" filter="url(#iconStarGlow)"/>

  <!-- Ambient stars -->
  <circle cx="180" cy="180" r="4" fill="white" opacity="0.35"/>
  <circle cx="844" cy="160" r="3" fill="white" opacity="0.25"/>
  <circle cx="150" cy="620" r="3.5" fill="white" opacity="0.2"/>
  <circle cx="874" cy="680" r="3" fill="white" opacity="0.3"/>
  <circle cx="420" cy="170" r="2.5" fill="white" opacity="0.2"/>
  <circle cx="830" cy="450" r="3.5" fill="white" opacity="0.25"/>
  <circle cx="190" cy="450" r="2.5" fill="white" opacity="0.18"/>
  <circle cx="700" cy="180" r="2" fill="white" opacity="0.2"/>
  <circle cx="512" cy="140" r="2" fill="white" opacity="0.15"/>
  <circle cx="300" cy="820" r="2.5" fill="white" opacity="0.15"/>
  <circle cx="724" cy="830" r="2" fill="white" opacity="0.18"/>
</svg>
