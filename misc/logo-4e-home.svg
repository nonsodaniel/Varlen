<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgHome" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#0F1830"/>
      <stop offset="100%" stop-color="#04060F"/>
    </radialGradient>
    <linearGradient id="homeLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#60A5FA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <filter id="homeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="peakGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Badge -->
  <circle cx="200" cy="200" r="180" fill="url(#bgHome)"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Ambient star field -->
  <circle cx="80"  cy="88"  r="1.5" fill="white" opacity="0.45"/>
  <circle cx="312" cy="72"  r="1"   fill="#60A5FA" opacity="0.5"/>
  <circle cx="65"  cy="275" r="1"   fill="white" opacity="0.3"/>
  <circle cx="338" cy="298" r="1.5" fill="#34D399" opacity="0.45"/>
  <circle cx="158" cy="52"  r="1"   fill="white" opacity="0.35"/>
  <circle cx="344" cy="175" r="1"   fill="white" opacity="0.4"/>
  <circle cx="95"  cy="338" r="1"   fill="#F472B6" opacity="0.35"/>
  <circle cx="280" cy="348" r="1"   fill="white" opacity="0.3"/>
  <circle cx="50"  cy="195" r="1"   fill="#60A5FA" opacity="0.35"/>

  <!-- House constellation outline -->
  <!-- Roof peak is the apex star, base has 4 corner stars -->
  <!-- Roof: peak → left-eave → right-eave back to peak -->
  <g filter="url(#homeGlow)">
    <!-- Roof left slope -->
    <line x1="200" y1="90"  x2="140" y2="160" stroke="url(#roofGrad)" stroke-width="2" opacity="0.85"/>
    <!-- Roof right slope -->
    <line x1="200" y1="90"  x2="260" y2="160" stroke="url(#roofGrad)" stroke-width="2" opacity="0.85"/>
    <!-- Eave / ceiling -->
    <line x1="140" y1="160" x2="260" y2="160" stroke="url(#homeLineGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Left wall -->
    <line x1="140" y1="160" x2="140" y2="230" stroke="url(#homeLineGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Right wall -->
    <line x1="260" y1="160" x2="260" y2="230" stroke="url(#homeLineGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Base -->
    <line x1="140" y1="230" x2="260" y2="230" stroke="url(#homeLineGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Door (centered) -->
    <line x1="185" y1="230" x2="185" y2="198" stroke="url(#homeLineGrad)" stroke-width="1"   opacity="0.45"/>
    <line x1="215" y1="230" x2="215" y2="198" stroke="url(#homeLineGrad)" stroke-width="1"   opacity="0.45"/>
    <line x1="185" y1="198" x2="215" y2="198" stroke="url(#homeLineGrad)" stroke-width="1"   opacity="0.45"/>
  </g>

  <!-- Corner stars -->
  <circle cx="140" cy="160" r="5.5" fill="#34D399" filter="url(#homeGlow)"/>
  <circle cx="260" cy="160" r="5.5" fill="#60A5FA" filter="url(#homeGlow)"/>
  <circle cx="140" cy="230" r="5"   fill="#A78BFA" filter="url(#homeGlow)"/>
  <circle cx="260" cy="230" r="5"   fill="#38BDF8" filter="url(#homeGlow)"/>

  <!-- Small heart inside the house (above door) -->
  <!-- Simple two-arc heart -->
  <path d="M200,180 C200,180 188,170 188,163 C188,157 194,153 200,159 C206,153 212,157 212,163 C212,170 200,180 200,180 Z"
    fill="#F472B6" filter="url(#peakGlow)" opacity="0.9"/>

  <!-- Roof peak star (bright) -->
  <circle cx="200" cy="90"  r="32" fill="url(#heartGlow)" opacity="0.25" filter="url(#peakGlow)"/>
  <circle cx="200" cy="90"  r="9"  fill="#60A5FA" filter="url(#peakGlow)"/>
  <circle cx="200" cy="90"  r="5"  fill="white"/>

  <!-- Wordmark -->
  <text x="200" y="286" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="32" font-weight="200" letter-spacing="10"
    fill="white" opacity="0.96">SIVEN&#x39B;</text>
  <text x="200" y="312" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="300" letter-spacing="5"
    fill="white" opacity="0.45">LIFE, TOGETHER</text>
</svg>
