<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Splash Screen Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0F1020;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  /* ─── container ─── */
  #splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    position: relative;
    opacity: 1;
  }

  /* ─── ambient stars ─── */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0;
  }

  /* ─── logo ─── */
  #logo-wrap {
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.4);
  }

  /* ─── text ─── */
  #brand {
    margin-top: 28px;
    font-size: 32px;
    font-weight: 200;
    letter-spacing: 12px;
    color: white;
    opacity: 0;
    transform: translateY(28px);
  }

  #tagline {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.4);
    text-transform: lowercase;
    opacity: 0;
  }

  /* ─── replay button ─── */
  #replay {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #replay:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div id="splash">
  <canvas id="stars-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>

  <div id="logo-wrap">
    <svg viewBox="0 0 400 400" width="260" height="260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="splBg" cx="50%" cy="45%" r="55%">
          <stop offset="0%"  stop-color="#0F1830"/>
          <stop offset="100%" stop-color="#04060F"/>
        </radialGradient>
        <linearGradient id="splLg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#34D399" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="splRg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#60A5FA" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
        </linearGradient>
        <clipPath id="splFr">
          <rect width="400" height="400" rx="84"/>
        </clipPath>
      </defs>
      <g clip-path="url(#splFr)">
        <!-- Background -->
        <rect width="400" height="400" fill="url(#splBg)"/>
        <!-- Star field -->
        <circle cx="80"  cy="72"  r="1.5" fill="white"   opacity="0.45"/>
        <circle cx="312" cy="58"  r="1"   fill="#60A5FA" opacity="0.5"/>
        <circle cx="65"  cy="295" r="1"   fill="white"   opacity="0.3"/>
        <circle cx="338" cy="318" r="1.5" fill="#34D399" opacity="0.45"/>
        <circle cx="158" cy="38"  r="1"   fill="white"   opacity="0.35"/>
        <circle cx="344" cy="195" r="1"   fill="white"   opacity="0.4"/>
        <circle cx="95"  cy="355" r="1"   fill="#F472B6" opacity="0.35"/>
        <circle cx="280" cy="365" r="1"   fill="white"   opacity="0.3"/>
        <circle cx="50"  cy="210" r="1"   fill="#60A5FA" opacity="0.35"/>
        <!-- Roof slopes -->
        <line x1="200" y1="88"  x2="103" y2="200" stroke="url(#splRg)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <line x1="200" y1="88"  x2="297" y2="200" stroke="url(#splRg)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <!-- Eave -->
        <line x1="103" y1="200" x2="297" y2="200" stroke="url(#splLg)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        <!-- Walls -->
        <line x1="103" y1="200" x2="103" y2="313" stroke="url(#splLg)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        <line x1="297" y1="200" x2="297" y2="313" stroke="url(#splLg)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        <!-- Base -->
        <line x1="103" y1="313" x2="297" y2="313" stroke="url(#splLg)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        <!-- Door -->
        <line x1="176" y1="313" x2="176" y2="262" stroke="url(#splLg)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <line x1="224" y1="313" x2="224" y2="262" stroke="url(#splLg)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <line x1="176" y1="262" x2="224" y2="262" stroke="url(#splLg)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <!-- Corner nodes -->
        <circle cx="103" cy="200" r="9"   fill="#3B82F6"/>
        <circle cx="297" cy="200" r="9"   fill="#EC4899"/>
        <circle cx="103" cy="313" r="8.5" fill="#10B981"/>
        <circle cx="297" cy="313" r="8.5" fill="#F59E0B"/>
        <!-- Heart -->
        <path d="M200,232 C200,232 180,217 180,204 C180,196 190,189 200,199 C210,189 220,196 220,204 C220,217 200,232 200,232 Z"
          fill="#F472B6" opacity="0.9"/>
        <!-- Roof peak star -->
        <circle cx="200" cy="88" r="16" fill="#60A5FA"/>
        <circle cx="200" cy="88" r="9"  fill="white"/>
      </g>
    </svg>
  </div>

  <div id="brand">SIVEN&#x039B;</div>
  <div id="tagline">life, together</div>
</div>

<button id="replay" onclick="runAnimation()">↺ Replay</button>

<script>
// ─── Ambient star data (mirroring React Native code, % of viewport) ───
const STAR_DATA = [
  { xp: 0.12, yp: 0.10, size: 3,   op: 0.4  },
  { xp: 0.80, yp: 0.08, size: 2,   op: 0.3  },
  { xp: 0.08, yp: 0.35, size: 3,   op: 0.25 },
  { xp: 0.90, yp: 0.32, size: 2,   op: 0.35 },
  { xp: 0.25, yp: 0.06, size: 2,   op: 0.2  },
  { xp: 0.85, yp: 0.22, size: 2.5, op: 0.3  },
  { xp: 0.06, yp: 0.58, size: 2,   op: 0.18 },
  { xp: 0.92, yp: 0.55, size: 2.5, op: 0.22 },
  { xp: 0.30, yp: 0.88, size: 2,   op: 0.2  },
  { xp: 0.72, yp: 0.90, size: 2.5, op: 0.25 },
  { xp: 0.50, yp: 0.04, size: 2,   op: 0.18 },
  { xp: 0.18, yp: 0.78, size: 2,   op: 0.15 },
  { xp: 0.82, yp: 0.75, size: 2,   op: 0.2  },
  { xp: 0.40, yp: 0.94, size: 1.5, op: 0.12 },
  { xp: 0.60, yp: 0.03, size: 1.5, op: 0.15 },
  { xp: 0.15, yp: 0.50, size: 1.5, op: 0.12 },
];

// ─── Easing helpers ───
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic  = t => Math.pow(t, 3);
const easeInOutSin = t => -(Math.cos(Math.PI * t) - 1) / 2;

function lerp(a, b, t) { return a + (b - a) * t; }

// ─── Tween engine ───
const tweens = [];
function addTween(delay, duration, from, to, easeFn, onUpdate, onDone) {
  tweens.push({ delay, duration, from, to, easeFn, onUpdate, onDone, elapsed: 0, started: false, done: false });
}

let lastTime = null;
let rafId = null;
let allTimers = [];

function tick(now) {
  if (!lastTime) lastTime = now;
  const dt = now - lastTime;
  lastTime = now;
  tweens.forEach(tw => {
    if (tw.done) return;
    tw.elapsed += dt;
    if (tw.elapsed < tw.delay) return;
    const t = Math.min((tw.elapsed - tw.delay) / tw.duration, 1);
    const val = lerp(tw.from, tw.to, tw.easeFn(t));
    tw.onUpdate(val);
    if (t >= 1) {
      tw.done = true;
      if (tw.onDone) tw.onDone();
    }
  });
  rafId = requestAnimationFrame(tick);
}

function stopAll() {
  cancelAnimationFrame(rafId);
  allTimers.forEach(clearTimeout);
  allTimers = [];
  tweens.length = 0;
  lastTime = null;
}

// ─── Draw ambient stars on canvas ───
let starAnimations = [];

function setupCanvas() {
  const canvas = document.getElementById('stars-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  starAnimations = [];

  STAR_DATA.forEach((s, i) => {
    const x = s.xp * window.innerWidth;
    const y = s.yp * window.innerHeight;
    starAnimations.push({ x, y, size: s.size, maxOp: s.op, currentOp: 0, phase: 0, delay: i * 60 });
  });

  return { canvas, ctx };
}

let canvasCtx = null;
let canvasEl  = null;

function drawStars(t) {
  if (!canvasCtx) return;
  canvasCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  starAnimations.forEach(s => {
    canvasCtx.beginPath();
    canvasCtx.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
    canvasCtx.fillStyle = `rgba(255,255,255,${s.currentOp})`;
    canvasCtx.fill();
  });
}

function animateStars(elapsed) {
  starAnimations.forEach((s, i) => {
    const t = Math.max(0, elapsed - s.delay);
    if (t <= 0) { s.currentOp = 0; return; }
    const period = 2200 + i * 20; // rough breathing period
    const phase = (t % period) / period;
    if (phase < 0.5) {
      s.currentOp = easeInOutSin(phase * 2) * s.maxOp;
    } else {
      s.currentOp = easeInOutSin(1 - (phase - 0.5) * 2) * s.maxOp;
    }
  });
  drawStars(elapsed);
}

// ─── Main animation sequence ───
function runAnimation() {
  stopAll();

  // Reset DOM
  const logo   = document.getElementById('logo-wrap');
  const brand  = document.getElementById('brand');
  const tag    = document.getElementById('tagline');
  const splash = document.getElementById('splash');

  logo.style.opacity  = '0';
  logo.style.transform = 'scale(0.4)';
  brand.style.opacity = '0';
  brand.style.transform = 'translateY(28px)';
  tag.style.opacity   = '0';
  splash.style.opacity = '1';
  splash.style.transform = 'scale(1)';

  // Reset canvas stars
  const cv = setupCanvas();
  canvasEl  = cv.canvas;
  canvasCtx = cv.ctx;

  let startTime = null;

  function frame(now) {
    if (!startTime) startTime = now;
    const elapsed = now - startTime;

    // Ambient stars
    animateStars(elapsed);

    // Logo fade-in (300–800ms)
    if (elapsed >= 300) {
      const t = Math.min((elapsed - 300) / 500, 1);
      logo.style.opacity = String(easeOutCubic(t));
    }

    // Logo scale spring approx (300ms+)
    if (elapsed >= 300) {
      const t = Math.min((elapsed - 300) / 700, 1);
      // Approximate spring with overshoot
      const spring = t < 0.6
        ? easeOutCubic(t / 0.6)
        : 1 + Math.sin((t - 0.6) / 0.4 * Math.PI) * 0.04 * (1 - (t - 0.6) / 0.4);
      logo.style.transform = `scale(${spring})`;
    }

    // Brand text (1300–1900ms)
    if (elapsed >= 1300) {
      const t = Math.min((elapsed - 1300) / 600, 1);
      brand.style.opacity = String(easeOutCubic(t));
      brand.style.transform = `translateY(${lerp(28, 0, easeOutCubic(t))}px)`;
    }

    // Tagline (1700–2200ms)
    if (elapsed >= 1700) {
      const t = Math.min((elapsed - 1700) / 500, 1);
      tag.style.opacity = String(easeOutCubic(t));
    }

    // Exit (5500–6200ms)
    if (elapsed >= 5500) {
      const t = Math.min((elapsed - 5500) / 700, 1);
      const sc = lerp(1, 1.08, easeInCubic(t));
      const op = lerp(1, 0,    easeInCubic(t));
      splash.style.transform = `scale(${sc})`;
      splash.style.opacity   = String(op);
    }

    if (elapsed < 6500) {
      rafId = requestAnimationFrame(frame);
    }
  }

  rafId = requestAnimationFrame(frame);
}

// ─── Start on load ───
window.addEventListener('load', () => {
  const cv = setupCanvas();
  canvasEl  = cv.canvas;
  canvasCtx = cv.ctx;
  runAnimation();
});

window.addEventListener('resize', () => {
  if (canvasEl) {
    canvasEl.width  = window.innerWidth;
    canvasEl.height = window.innerHeight;
  }
});
</script>
</body>
</html>
