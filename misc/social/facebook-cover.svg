<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <!-- Facebook Cover Photo — 820×312 -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="50%" r="65%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080810;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.28" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="820" height="312" fill="url(#bg)"/>

  <!-- Ambient stars -->
  <circle cx="60" cy="40" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="220" cy="60" r="1.2" fill="white" opacity="0.2"/>
  <circle cx="500" cy="30" r="1.5" fill="white" opacity="0.22"/>
  <circle cx="700" cy="50" r="1.2" fill="white" opacity="0.18"/>
  <circle cx="790" cy="140" r="1.2" fill="white" opacity="0.15"/>
  <circle cx="750" cy="270" r="1.5" fill="white" opacity="0.18"/>
  <circle cx="450" cy="285" r="1.2" fill="white" opacity="0.15"/>
  <circle cx="60" cy="260" r="1.5" fill="white" opacity="0.18"/>

  <!-- Logo constellation — left, scaled for short canvas -->
  <g transform="translate(50, 15) scale(0.82)">
    <circle cx="200" cy="165" r="26" fill="none" stroke="#EF4444" stroke-width="0.8" opacity="0.12"/>
    <circle cx="200" cy="165" r="44" fill="none" stroke="#EF4444" stroke-width="0.4" opacity="0.06"/>
    <circle cx="200" cy="165" r="18" fill="url(#redGlow)"/>

    <line x1="200" y1="260" x2="140" y2="200" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="200" x2="130" y2="160" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="160" x2="155" y2="135" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="155" y1="135" x2="185" y2="140" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="140" x2="200" y2="165" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="165" x2="215" y2="140" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="215" y1="140" x2="245" y2="135" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="245" y1="135" x2="270" y2="160" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="270" y1="160" x2="260" y2="200" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
    <line x1="260" y1="200" x2="200" y2="260" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>

    <circle cx="200" cy="260" r="6" fill="white" filter="url(#starGlow)"/>
    <circle cx="140" cy="200" r="5" fill="#3B82F6" filter="url(#starGlow)"/>
    <circle cx="130" cy="160" r="4" fill="#10B981" filter="url(#starGlow)"/>
    <circle cx="155" cy="135" r="5" fill="#F59E0B" filter="url(#starGlow)"/>
    <circle cx="185" cy="140" r="4" fill="#8B5CF6" filter="url(#starGlow)"/>
    <circle cx="200" cy="165" r="7" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="215" cy="140" r="4" fill="#8B5CF6" filter="url(#starGlow)"/>
    <circle cx="245" cy="135" r="5" fill="#F59E0B" filter="url(#starGlow)"/>
    <circle cx="270" cy="160" r="4" fill="#10B981" filter="url(#starGlow)"/>
    <circle cx="260" cy="200" r="5" fill="#3B82F6" filter="url(#starGlow)"/>
  </g>

  <!-- Brand text -->
  <text x="560" y="150" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="200" letter-spacing="18" fill="white" opacity="0.93">SIVEN&#x39B;</text>
  <text x="560" y="195" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="7" fill="white" opacity="0.85">LIFE, TOGETHER</text>
</svg>
